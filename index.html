<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Joe's Pizza</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: the Business 101 deck's look (cream ground, charcoal panels, tomato red, mustard, sage).
   The kitchen runs left to right in routing order: 1 Prepare dough, 2 Add toppings, 3 Bake, 4 Cut, 5 Box. */
:root {
  --cream: #fbf3e6;
  --card: #fffaf2;
  --line: #eadcc6;
  --navy: #1f2833;
  --navy-2: #2b3641;
  --ink: #1f2833;
  --muted: #6b7480;
  --red: #c94d3a;
  --red-tint: #f5dad3;
  --mustard: #e6ae47;
  --mustard-tint: #f7e7c2;
  --sage: #52765c;
  --sage-tint: #dce7de;
  --brown: #a06e58;
  --on-dark: #f6efe4;
  --on-dark-muted: #a9b2bc;
  --font: "Inter", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--cream); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.4; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--mustard); outline-offset: 2px; }

.app {
  max-width: 1240px; margin: 0 auto;
  padding-block: 14px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px;
}
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--red); margin: 0; }

/* Top bar */
.top { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; }
.title h1 { margin: 2px 0 0; font-size: clamp(22px, 3vw, 30px); font-weight: 800; letter-spacing: -.01em; }
.stats { display: flex; flex-wrap: wrap; gap: 8px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; min-width: 92px; }
.stat small { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.stat b { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat.dark { background: var(--navy); border-color: var(--navy); color: var(--on-dark); }
.stat.dark small { color: var(--on-dark-muted); }
.stat.warn b { color: var(--red); }
.stat.dark.warn b { color: #ff8f7a; }
.stat.ok b { color: var(--sage); }
.tools { display: flex; gap: 8px; }
.ghost { border: 1px solid var(--line); background: var(--card); border-radius: 9px; padding: 8px 12px; cursor: pointer; font-size: 13px; font-weight: 600; }
.ghost:hover { background: #fff; }
.progress { height: 8px; border-radius: 4px; background: #eadfcd; overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--sage); }

/* Line of stations */
.line { display: grid; gap: 12px; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr) minmax(0, .9fr) minmax(0, .8fr); align-items: stretch; }
@media (max-width: 1060px) { .line { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
@media (max-width: 620px) { .line { grid-template-columns: minmax(0, 1fr); } }
.station { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.station.dark { background: var(--navy); border-color: var(--navy); color: var(--on-dark); }
.st-head { display: flex; align-items: center; gap: 10px; }
.steps { display: flex; gap: 4px; }
.step { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 800; background: var(--navy); color: var(--on-dark); flex: none; }
.station.dark .step { background: var(--red); }
.st-head h2 { margin: 0; font-size: 16px; font-weight: 800; }
.st-head small { margin-left: auto; font-size: 12px; color: var(--muted); text-align: right; }
.station.dark .st-head small { color: var(--on-dark-muted); }

.prep-body { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start; }
.peel { flex: none; width: 216px; height: 216px; max-width: 100%; border-radius: 50%; margin-inline: auto; background: radial-gradient(circle at 40% 35%, #e9c595, #d3a26b 70%, #b98250); box-shadow: 0 5px 0 #a3713f; display: grid; place-items: center; position: relative; }
.peel canvas { width: 196px; height: 196px; }
.peel-hint { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 44px; font-weight: 600; font-size: 13.5px; color: #6b4521; pointer-events: none; }
.prep-side { flex: 1 1 210px; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.pour {
  display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center;
  border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: #fff; cursor: pointer; text-align: left;
  touch-action: none; user-select: none; -webkit-user-select: none;
}
.pour:disabled { cursor: not-allowed; opacity: .5; }
.pour.active { border-color: var(--red); box-shadow: 0 0 0 2px var(--red-tint); }
.pour b { font-size: 14px; }
.pour kbd, .btn kbd, .routing kbd { font-family: inherit; font-weight: 700; font-size: 11px; border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; opacity: .75; }
.pour .cost { grid-column: 1 / -1; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pgauge { grid-column: 1 / -1; position: relative; height: 10px; border-radius: 5px; background: linear-gradient(90deg, #e6dccb 0 59.4%, #9fc3a6 59.4% 71.9%, #f0c0b5 71.9%); }
.pgauge i { position: absolute; inset: 0 auto 0 0; border-radius: 5px; background: var(--navy-2); opacity: .85; width: 0; }
.pgauge em { position: absolute; top: -3px; bottom: -3px; left: 62.5%; width: 2px; background: var(--sage); }
.pour .state { font-size: 12px; font-weight: 700; }
.pour[data-s="ok"] .state { color: var(--sage); }
.pour[data-s="heavy"] .state { color: var(--red); }
.pour[data-s="short"] .state { color: var(--muted); }

.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border: 0; border-radius: 9px; padding: 10px 14px; cursor: pointer; font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; background: var(--navy); color: var(--on-dark); }
.btn.red { background: var(--red); color: #fff; }
.btn.mustard { background: var(--mustard); color: var(--navy); }
.btn.light { background: #fff; color: var(--ink); border: 1px solid var(--line); }
.station.dark .btn.light { background: var(--navy-2); color: var(--on-dark); border-color: #3c4855; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn:active:not(:disabled) { transform: translateY(1px); }

.decks { display: flex; flex-direction: column; gap: 8px; }
.deck { display: flex; align-items: center; gap: 10px; padding: 6px 10px 6px 6px; border-radius: 10px; border: 0; text-align: left; cursor: pointer; color: var(--on-dark);
  background: radial-gradient(ellipse at 22% 50%, rgba(230,120,50,.32), transparent 60%), #151b22; }
.deck:disabled { cursor: default; }
.deck canvas { width: 70px; height: 70px; flex: none; }
.deck-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.deck-top { display: flex; justify-content: space-between; gap: 6px; font-size: 13px; font-weight: 700; }
.deck-top kbd { font-family: inherit; font-size: 11px; color: var(--on-dark-muted); border: 1px solid #3c4855; border-radius: 4px; padding: 0 4px; font-weight: 600; }
.bgauge { position: relative; height: 10px; border-radius: 5px; background: linear-gradient(90deg, #56606b 0 56.25%, #5f9a6c 56.25% 81.25%, #c94d3a 81.25%); }
.deck:disabled .bgauge { opacity: .3; }
.bgauge i { position: absolute; top: -3px; bottom: -3px; width: 4px; margin-left: -2px; background: #fff; border-radius: 2px; box-shadow: 0 0 0 1px #000; left: 0; }
.deck[data-g="good"] { box-shadow: inset 0 0 0 2px #7fc08e; }
.deck[data-g="good"] .deck-label { color: #a8e0b3; }
.deck[data-g="burnt"] { box-shadow: inset 0 0 0 2px var(--red); }
.deck[data-g="burnt"] .deck-label { color: #ff8f7a; }
.deck[data-g="down"] { opacity: .55; background: repeating-linear-gradient(45deg, #151b22 0 10px, #222a33 10px 20px); }
.deck[data-g="down"] .deck-label { color: #ffb4a6; }

.board { width: 150px; height: 150px; margin-inline: auto; border-radius: 12px; background: repeating-linear-gradient(90deg, #d9b68a 0 14px, #d1ad7f 14px 15px); box-shadow: 0 4px 0 #b48b5c; display: grid; place-items: center; }
.board canvas { width: 136px; height: 136px; }
.board-status { text-align: center; font-size: 13px; font-weight: 700; min-height: 1.4em; margin: 0; }
.board-status.good { color: var(--sage); }
.board-status.bad { color: var(--red); }

.boxes { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; }
.boxes span { aspect-ratio: 1; max-width: 100%; border-radius: 4px; border: 1.5px dashed #cdbfa8; }
.boxes span.done { border: 0; background: var(--mustard); box-shadow: inset 0 -4px 0 rgba(0,0,0,.12); position: relative; }
.boxes span.done::after { content: ""; position: absolute; inset: 30% 22%; border-radius: 50%; background: var(--red); opacity: .8; }
.box-count { text-align: center; font-size: 13px; color: var(--muted); margin: 0; }
.box-count b { color: var(--ink); font-size: 20px; font-weight: 800; }

/* Live standard vs actual */
.ledger-live { display: grid; gap: 12px; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr) minmax(0, 1fr); }
@media (max-width: 1060px) { .ledger-live { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .ledger-live > :first-child { grid-column: 1 / -1; } }
@media (max-width: 680px) { .ledger-live { grid-template-columns: minmax(0, 1fr); } }
.coach { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; background: var(--navy); color: var(--on-dark); border-radius: 12px; padding: 10px 14px; box-shadow: 0 6px 18px rgba(31,40,51,.25); }
.coach-tag { font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--mustard); }
.coach p { margin: 0; flex: 1 1 260px; font-weight: 600; }
.coach .ghost { background: transparent; color: var(--on-dark); border-color: #3c4855; }
.coach-on { outline: 3px solid var(--mustard) !important; outline-offset: 3px; animation: coachPulse 1.2s ease-in-out infinite; }
@keyframes coachPulse { 50% { outline-color: rgba(230, 174, 71, .2); } }
.books { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.bk { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-width: 0; }
.bk small { display: block; font-size: 11px; color: var(--muted); font-weight: 600; }
.bk b { font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; }
.ovenbar { height: 10px; border-radius: 5px; background: #efe4d2; overflow: hidden; margin-top: 10px; }
.ovenbar i { display: block; height: 100%; background: var(--sage); }
.books-wrap .note { margin-top: 6px; }
.funds { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 760px) { .funds { grid-template-columns: minmax(0, 1fr); } }
.fund { display: flex; flex-direction: column; gap: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.fund .ftag { align-self: flex-start; font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; background: var(--navy); color: #fff; }
.fund b { font-size: 16px; }
.fund p { font-size: 13.5px; color: #3c4652; }
.fund .cons { font-weight: 700; color: var(--red); }
.fund .btn { margin-top: auto; align-self: flex-start; }
.calc-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 640px) { .calc-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.calc label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: var(--muted); }
.calc input { font: inherit; font-size: 16px; font-weight: 600; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); width: 100%; min-width: 0; font-variant-numeric: tabular-nums; }
.calc-out { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
@media (max-width: 640px) { .calc-out { grid-template-columns: minmax(0, 1fr); } }
.calc-out div { border-radius: 10px; padding: 10px 12px; background: var(--mustard-tint); }
.calc-out div:nth-child(2) { background: var(--red-tint); }
.calc-out div:nth-child(3) { background: var(--sage-tint); }
.calc-out small { display: block; font-size: 12px; font-weight: 700; color: #4b5560; }
.calc-out b { display: block; font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
.calc-out span { font-size: 12.5px; color: #4b5560; }
.closing { background: var(--navy); color: var(--on-dark); border-radius: 14px; padding: clamp(18px, 4vw, 28px); display: flex; flex-direction: column; gap: 8px; }
.closing p { font-size: clamp(22px, 4.2vw, 32px); font-weight: 800; line-height: 1.15; letter-spacing: -.01em; text-wrap: balance; color: var(--on-dark); }
.closing p span { color: var(--mustard); }
.closing small { font-size: 14px; color: var(--on-dark-muted); }
.paid { background: var(--sage-tint); border-radius: 12px; padding: 10px 14px; font-size: 14px; }
.panel-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; min-width: 0; }
.panel-card h3 { margin: 0 0 8px; font-size: 14px; font-weight: 800; }
.tbl { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; }
.tbl th { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; text-align: right; padding: 0 0 6px 8px; }
.tbl th:first-child { text-align: left; padding-left: 0; }
.tbl td { padding: 5px 0 5px 8px; border-top: 1px solid var(--line); text-align: right; }
.tbl td:first-child { text-align: left; padding-left: 0; }
.tbl tr.total td { font-weight: 800; border-top: 2px solid var(--ink); }
.over { color: var(--red); font-weight: 700; }
.under { color: var(--sage); font-weight: 700; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.fact { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.fact small { display: block; font-size: 11px; color: var(--muted); font-weight: 600; }
.fact b { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }

/* Overlay */
.overlay { position: fixed; inset: 0; z-index: 30; background: rgba(31, 40, 51, .62); backdrop-filter: blur(3px); overflow-y: auto; display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.overlay { grid-template-columns: minmax(0, 1fr); justify-items: center; }
.sheet { min-width: 0; width: 100%; max-width: 780px; background: var(--cream); border-radius: 16px; padding: clamp(18px, 4vw, 32px); box-shadow: 0 24px 60px rgba(0,0,0,.35); display: flex; flex-direction: column; gap: 16px; }
.sheet.wide { max-width: 1000px; }
.sheet h1, .sheet h2 { margin: 0; font-weight: 800; letter-spacing: -.015em; line-height: 1.1; text-wrap: balance; }
.sheet h1 { font-size: clamp(30px, 6vw, 44px); }
.sheet h2 { font-size: clamp(24px, 4.4vw, 32px); }
.sheet p { margin: 0; max-width: 70ch; }
.lead { font-size: 16px; }
.cost-eq { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; background: var(--navy); color: var(--on-dark); border-radius: 12px; padding: 14px; }
.chip { background: var(--navy-2); border-radius: 9px; padding: 8px 12px; text-align: center; min-width: 88px; }
.chip b { display: block; font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.chip small { font-size: 11px; color: var(--on-dark-muted); font-weight: 600; }
.chip.m b { color: var(--mustard); }
.chip.r b { color: #f08a76; }
.chip.g b { color: #8fbf98; }
.chip.total { background: var(--red); }
.chip.total b, .chip.total small { color: #fff; }
.op { font-size: 18px; color: var(--on-dark-muted); font-weight: 700; }
.routing { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin: 0; padding: 0; list-style: none; }
@media (max-width: 680px) { .routing { grid-template-columns: minmax(0, 1fr); } }
.routing li { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.routing li b { font-size: 14px; }
.note { font-size: 13px; color: var(--muted); }
.cta-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.cta-row .btn { font-size: 16px; padding: 12px 20px; }

.options { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.opt { text-align: left; border: 2px solid var(--line); background: var(--card); border-radius: 12px; padding: 12px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
.opt[aria-checked="true"] { border-color: var(--red); background: #fff; box-shadow: 0 0 0 3px var(--red-tint); }
.opt .rate { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
.opt .rate small { font-size: 13px; font-weight: 600; color: var(--muted); }
.opt .tag { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--red); }
.opt .math { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.opt .ready { font-size: 15px; font-weight: 800; }
.quote { font-size: clamp(22px, 4vw, 30px); font-weight: 800; }

/* Report */
.rep-grid { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
@media (max-width: 760px) { .rep-grid { grid-template-columns: minmax(0, 1fr); } }
.bars { display: flex; flex-direction: column; gap: 14px; }
.bar-row { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 10px; align-items: center; font-size: 13px; }
.bar-row > span:first-child { font-weight: 600; }
.bar-track { position: relative; height: 24px; }
.bar-track i { position: absolute; top: 0; height: 18px; border-radius: 4px; }
.bar-track i.std { top: 20px; height: 5px; background: #bfae94; }
.bar-track b { position: absolute; top: 9px; transform: translateY(-50%); font-size: 13px; font-weight: 800; white-space: nowrap; font-variant-numeric: tabular-nums; }
.zero { position: absolute; top: -4px; bottom: -4px; width: 1px; background: var(--ink); opacity: .35; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; margin-top: 14px; }
.legend span::before { content: ""; display: inline-block; width: 12px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: middle; background: var(--c); }
.headline { background: var(--navy); color: var(--on-dark); border-radius: 14px; padding: 18px; display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: center; }
.headline .big { font-size: clamp(36px, 7vw, 52px); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.headline .big.neg { color: #ff8f7a; }
.headline .big.pos { color: #8fbf98; }
.headline p { color: var(--on-dark-muted); flex: 1 1 300px; }
.headline strong { color: var(--on-dark); }
.lessons { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.lesson { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.lesson b { display: block; margin-bottom: 4px; }
.lesson p { font-size: 13.5px; color: #3c4652; }
.cap { display: flex; gap: 10px; flex-wrap: wrap; }
.cap div { flex: 1 1 120px; border-radius: 10px; padding: 10px 12px; }
.cap .plan { background: var(--mustard-tint); }
.cap .real { background: var(--red-tint); }
.cap b { display: block; font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; }
.cap small { font-size: 12px; color: #4b5560; }
.hist { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.hist th { text-align: right; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 0 0 6px 10px; white-space: nowrap; }
.hist td { text-align: right; padding: 5px 0 5px 10px; border-top: 1px solid var(--line); white-space: nowrap; }
.hist th:first-child, .hist td:first-child { text-align: left; padding-left: 0; }
.scroll-x { overflow-x: auto; }
.xlate th, .xlate td { text-align: left !important; white-space: normal; }

<body>
<div class="app">
  <header class="top">
    <div class="title">
      <p class="eyebrow">Business 101 · Joe's Pizza</p>
      <h1>The Friday shift</h1>
    </div>
    <div class="stats">
      <div class="stat dark" id="stClockBox"><small>Clock</small><b id="stClock">4:00 PM</b></div>
      <div class="stat"><small>Promised</small><b id="stPromise">5:00 PM</b></div>

<script>
(() => {
'use strict';

/* ---------- The deck's numbers ---------- */
const ORDER = 10;            // pizzas in the catering order
const RUN_SHIFTS = 3;        // a run is three Fridays
const PRICE = 12;            // customer pays per pizza
const OTHER = 3;             // other business costs, per pizza equivalent
const WAGE = 20, OT_WAGE = 30;
const STD_RATE = 20;         // Joe's standard run rate, pizzas per hour
const OH_PER_HR = 30;        // overhead runs $30/hr, which is $1.50 a pizza at 20/hr
const COST = { dough: 1.00, sauce: 0.50, cheese: 2.00, pep: 1.00 };
const STD_MAT = 4.50, STD_LAB = 1.00, STD_OH = 1.50, STD_COST = 7.00;

/* ---------- Pace of play ---------- */
const SEC_PER_MIN = 2;       // 2 real seconds = 1 kitchen minute, so 20/hr is one pizza every 6 seconds
const START = 16 * 60;       // 4:00 PM
const MAX_MIN = 180;         // Joe sends everyone home after 3 hours
const POUR_SEC = 1.0;        // seconds of holding to pour one BOM portion
const MIN_P = 0.95, OK_HI = 1.15, MAX_P = 1.6;
// 11 s bake (5.5 kitchen min). Two decks top out near 24/hr with perfect pulls, about 22/hr for a sharp
// human: standard (20/hr) is reachable, and the oven still caps the best players just above it.
// The good window stays about 2.8 s wide (9.9 s to 12.65 s), as sharp as before.
const BAKE_SEC = 11, GOOD_LO = 0.9, GOOD_HI = 1.15, BAKE_MAX = 1.6;
const BOOKS_KEY = 'joes-pizza-b101-books';
// Floor events, fixed by Friday so a class shares the same experience.
const EVENTS = { 2: { id: 'oven', at: 8, down: 15, fast: 5 }, 3: { id: 'callout', at: 0 } };
const REPROMISE_OFF = 0.05, EXPEDITE_COST = 25, COVER_WAGE = 30, HAND_STRETCH_SEC = 2;
const QUOTE = 'Bad news early is cheaper than bad news late.';
const OVEN_COST = 200, BANK_LIMIT = 150, INTEREST = 0.05;
const HIST_KEY = 'joes-pizza-b101-history';
const TAU = Math.PI * 2;

/* ---------- helpers ---------- */
const $ = (s) => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const money = (v) => (v < -0.004 ? '-' : '') + '$' + Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const signed = (v) => (v > 0.004 ? '+' : v < -0.004 ? '-' : '') + '$' + Math.abs(v).toFixed(2);
const r1 = (v) => Math.round(v * 10) / 10;
function clock(min) {
  const m = Math.round(START + min), h24 = Math.floor(m / 60) % 24, mm = m % 60;
  return `${((h24 + 11) % 12) + 1}:${String(mm).padStart(2, '0')} ${h24 < 12 ? 'AM' : 'PM'}`;
}
function dur(min) {
  const m = Math.round(min), h = Math.floor(m / 60), mm = m % 60;
  return h ? `${h} h ${String(mm).padStart(2, '0')} m` : `${mm} min`;
}
function rng(seed) {
  let s = seed | 0;
  return () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function ramp(stops, v) {
  if (v <= stops[0][0]) return stops[0][1];
  for (let i = 1; i < stops.length; i++) if (v <= stops[i][0]) {
    const [a0, c0] = stops[i - 1], [a1, c1] = stops[i], t = (v - a0) / (a1 - a0), x = hexRgb(c0), y = hexRgb(c1);
    return `rgb(${x.map((c, k) => Math.round(c + (y[k] - c) * t)).join(',')})`;
  }
  return stops[stops.length - 1][1];
}
function freshBooks() { return { savings: 100, ovenFund: 150, loan: 0, decks: 2, ovenBought: false }; }
function loadBooks() { try { const b = Object.assign(freshBooks(), JSON.parse(localStorage.getItem(BOOKS_KEY)) || {}); b.decks = b.ovenBought ? 3 : 2; return b; } catch (e) { return freshBooks(); } }

/* ---------- audio ---------- */
let ac = null, muted = false;
function sfx(kind) {
  if (muted) return;
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  if (ac.state === 'suspended') ac.resume();
  const t0 = ac.currentTime;
  const tone = (f, d, type = 'sine', v = 0.1, at = 0) => {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(v, t0 + at); g.gain.exponentialRampToValueAtTime(0.0008, t0 + at + d);
    o.connect(g); g.connect(ac.destination); o.start(t0 + at); o.stop(t0 + at + d + 0.02);
  };
  if (kind === 'pop') tone(520, 0.06, 'square', 0.035);
  if (kind === 'ready') { tone(740, 0.12); tone(988, 0.18, 'sine', 0.1, 0.1); }
  if (kind === 'box') { tone(1046, 0.2, 'sine', 0.1); tone(1568, 0.3, 'sine', 0.08, 0.08); }
  if (kind === 'bad') tone(130, 0.3, 'sawtooth', 0.05);
  if (kind === 'burn') { tone(200, 0.4, 'square', 0.035); tone(180, 0.4, 'square', 0.035, 0.2); }
  if (kind === 'done') [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.3, 'triangle', 0.08, i * 0.12));
}

/* ---------- drawing ---------- */
const CRUST = [[0, '#f2ddb0'], [0.6, '#edca8c'], [1, '#d9953f'], [1.3, '#a0602b'], [1.7, '#3a2517']];
const SAUCE = [[0, '#cf3b20'], [1, '#b8301a'], [1.4, '#7e2312'], [1.7, '#3d160c']];
const CHEESE = [[0.25, '#f8e8a8'], [0.9, '#f6d265'], [1.15, '#eab248'], [1.5, '#a8682a']];
function setupCanvas(cv, size) {
  const d = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(size * d); cv.height = Math.round(size * d);
  const ctx = cv.getContext('2d'); ctx.setTransform(d, 0, 0, d, 0, 0); return ctx;
}
function blob(ctx, r, seed, amp = 0.03, n = 30) {
  const R = rng(seed), o1 = R() * TAU, o2 = R() * TAU, o3 = R() * TAU;
  ctx.beginPath();
  for (let i = 0; i <= n; i++) {
    const a = (i / n) * TAU, k = 1 + amp * (Math.sin(a * 3 + o1) + 0.6 * Math.sin(a * 5 + o2) + 0.3 * Math.sin(a * 7 + o3));
    if (i) ctx.lineTo(Math.cos(a) * r * k, Math.sin(a) * r * k); else ctx.moveTo(Math.cos(a) * r * k, Math.sin(a) * r * k);
  }
  ctx.closePath(); ctx.fill();
}
function shreds(ctx, R, seed, count) {
  const r = rng(seed);
  for (let i = 0; i < count; i++) {
    const a = r() * TAU, d = Math.sqrt(r()) * R;
    ctx.save(); ctx.translate(Math.cos(a) * d, Math.sin(a) * d); ctx.rotate(r() * TAU);
    ctx.fillStyle = r() < 0.5 ? '#fbeeb8' : '#f3dd8e';
    ctx.fillRect(-R * 0.09, -R * 0.018, R * 0.18, R * 0.036); ctx.restore();
  }
}
function pepperoni(ctx, x, y, s) {
  ctx.fillStyle = '#b3301d'; ctx.beginPath(); ctx.arc(x, y, s, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#8a2213'; ctx.lineWidth = s * 0.16; ctx.stroke();
  ctx.fillStyle = '#e2765f';
  [[-0.35, -0.3], [0.3, 0.2], [-0.1, 0.45]].forEach(([u, v]) => { ctx.beginPath(); ctx.arc(x + u * s, y + v * s, s * 0.12, 0, TAU); ctx.fill(); });
}
function scatter(n, seed) {
  const r = rng(seed), pts = []; let tries = 0;
  while (pts.length < n && tries < 600) {
    tries++;
    const a = r() * TAU, d = Math.sqrt(r()) * 0.68, x = Math.cos(a) * d, y = Math.sin(a) * d, m = tries < 300 ? 0.27 : 0.14;
    if (pts.every((p) => (p.x - x) ** 2 + (p.y - y) ** 2 > m * m)) pts.push({ x, y });
  }
  return pts;
}
function drawPizza(ctx, p, size) {
  ctx.clearRect(0, 0, size, size);
  if (!p) return;
  const r = size * 0.46, b = p.bake;
  ctx.save(); ctx.translate(size / 2, size / 2);
  ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(0, r * 0.05, r, r * 0.98, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = ramp(CRUST, b); blob(ctx, r, p.seed, 0.025);
  ctx.strokeStyle = 'rgba(255,255,255,.15)'; ctx.lineWidth = r * 0.05;
  ctx.beginPath(); ctx.arc(0, 0, r * 0.91, Math.PI * 1.08, Math.PI * 1.55); ctx.stroke();
  if (p.sauce > 0) { ctx.fillStyle = ramp(SAUCE, b); blob(ctx, r * 0.83 * clamp(0.3 + 0.7 * p.sauce, 0.3, 1.1), p.seed + 1, 0.04); }
  if (p.cheese > 0) {
    const melt = clamp((b - 0.25) / 0.6, 0, 1), cr = r * 0.78 * clamp(0.45 + 0.55 * p.cheese, 0.45, 1.08);
    if (melt < 1) { ctx.globalAlpha = 1 - melt; shreds(ctx, cr, p.seed + 2, Math.round(60 * Math.min(p.cheese, 1.6))); ctx.globalAlpha = 1; }
    if (melt > 0) {
      ctx.globalAlpha = melt; ctx.fillStyle = ramp(CHEESE, b); blob(ctx, cr, p.seed + 3, 0.06, 44);
      const R = rng(p.seed + 4), spots = Math.floor(clamp((b - 0.7) / 0.6, 0, 1) * 16);
      ctx.fillStyle = 'rgba(170,98,34,.55)';
      for (let i = 0; i < spots; i++) { const a = R() * TAU, d = Math.sqrt(R()) * cr * 0.85; ctx.beginPath(); ctx.arc(Math.cos(a) * d, Math.sin(a) * d, r * (0.03 + R() * 0.04), 0, TAU); ctx.fill(); }
      ctx.globalAlpha = 1;
    }
  }
  const n = Math.min(p.pts.length, Math.round(12 * p.pep));
  for (let i = 0; i < n; i++) pepperoni(ctx, p.pts[i].x * r, p.pts[i].y * r, r * 0.105);
  if (b > GOOD_HI - 0.1) { ctx.fillStyle = `rgba(35,18,8,${clamp((b - GOOD_HI + 0.1) / 0.5, 0, 1) * 0.8})`; blob(ctx, r * 1.004, p.seed, 0.025); }
  if (p.cut) {
    ctx.strokeStyle = 'rgba(70,35,12,.55)'; ctx.lineWidth = Math.max(1.2, r * 0.025);
    for (let i = 0; i < 4; i++) { const a = (i / 4) * Math.PI + 0.3; ctx.beginPath(); ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r); ctx.lineTo(-Math.cos(a) * r, -Math.sin(a) * r); ctx.stroke(); }
  }
  ctx.restore();
}

/* ---------- state ---------- */
const G = { phase: 'title', paused: false, shiftNo: 0, hist: loadHist(), pickRate: STD_RATE, sh: null, deb: null, goal: null, books: loadBooks(), practiced: false };
function newShift(rate) {
  return { rate, promiseMin: (ORDER / rate) * 60, t: 0, prep: null, oven: Array(G.books.decks).fill(null), board: null,
    pies: [], boxed: 0, scrapN: 0, reworkN: 0, pouring: null, lateNoted: false, ended: false, log: [], boxTimes: [],
    event: null, down: null, handDough: false, stretch: 0, cover: false, expedite: false, repromise: false,
    wait: { avail: 0, empty: 0, baking: 0, holding: 0 } };
}
const nowMin = () => G.sh.t / SEC_PER_MIN;
const isDown = (i) => !!(G.sh && G.sh.down && G.sh.down.i === i && nowMin() < G.sh.down.until);
const freeDeck = () => G.sh.oven.findIndex((p, i) => !p && !isDown(i));
const playing = () => (G.phase === 'play' || G.phase === 'practice') && !G.paused;
const pieMat = (p) => COST.dough + COST.sauce * p.sauce + COST.cheese * p.cheese + COST.pep * p.pep;
function grade(b) { return b < GOOD_LO ? 'under' : b <= GOOD_HI ? 'good' : 'burnt'; }

/* ---------- economics ---------- */
function calc(sh, final) {
  const min = sh.t / SEC_PER_MIN, hrs = min / 60, sched = sh.promiseMin / 60, good = sh.boxed;
  const mat = sh.pies.reduce((s, p) => s + pieMat(p), 0);
  const goodMat = sh.pies.filter((p) => p.state === 'boxed').reduce((s, p) => s + pieMat(p), 0);
  const otHrs = Math.max(0, hrs - sched);
  const idleHrs = final && good >= ORDER ? Math.max(0, sched - hrs) : 0;
  const cover = sh.cover ? COVER_WAGE * hrs : 0, expedite = sh.expedite ? EXPEDITE_COST : 0;
  const labor = WAGE * Math.min(hrs, sched) + OT_WAGE * otHrs + WAGE * idleHrs + cover;
  const oh = OH_PER_HR * hrs + expedite;
  const late = Math.max(0, min - sh.promiseMin);
  const discPct = final && late > 0.5 ? Math.min(0.25, 0.05 * Math.ceil(late / 15)) : 0;
  const revGross = PRICE * good, disc = revGross * discPct, repDisc = sh.repromise ? revGross * REPROMISE_OFF : 0;
  const rev = revGross - disc - repDisc;
  const cogs = mat + labor + oh, gp = rev - cogs, other = OTHER * good, op = gp - other;
  const parts = {
    over: goodMat - STD_MAT * good,
    scrap: mat - goodMat,
    slow: WAGE * hrs - STD_LAB * good,
    ot: (OT_WAGE - WAGE) * otHrs,
    idle: WAGE * idleHrs,
    oh: OH_PER_HR * hrs - STD_OH * good,
    disc,
    event: cover + expedite + repDisc,
  };
  return { min, hrs, good, mat, goodMat, labor, oh, late, discPct, revGross, disc, repDisc, evCost: cover + expedite, rev, cogs, gp, other, op, parts,
    rate: hrs > 0 ? good / hrs : 0, std: { rev: PRICE * good, cogs: STD_COST * good, gp: 5 * good, other: OTHER * good, op: 2 * good } };
}

/* ---------- toast ---------- */
let toastT = 0;
function toast(msg, kind = '') {
  const el = $('#toast'); el.textContent = msg; el.className = 'toast show ' + kind;
  clearTimeout(toastT); toastT = setTimeout(() => { el.className = 'toast ' + kind; }, 2400);
}

/* ---------- actions ---------- */
function dough() {
  if (!playing()) return;
  const sh = G.sh;
  if (sh.prep) { toast('Finish the pizza on the counter first.'); return; }
  if (sh.stretch > 0) return;
  if (sh.handDough && !sh.stretchDone) { sh.stretch = HAND_STRETCH_SEC; refreshPrep(); return; }
  sh.stretchDone = false;
  const seed = (Math.random() * 1e9) | 0;
  sh.prep = { seed, sauce: 0, cheese: 0, pep: 0, bake: 0, cut: false, pts: scatter(20, seed + 9), state: 'wip' };
  sh.pies.push(sh.prep);
  sfx('pop'); refreshPrep();
}
function pourBlock(k) {
  const p = G.sh.prep;
  if (!p) return 'Stretch dough first.';
  if (k === 'cheese' && p.sauce < MIN_P) return 'Routing: sauce goes on before cheese.';
  if (k === 'pep' && p.cheese < MIN_P) return 'Routing: cheese goes on before pepperoni.';
  if (p[k] >= MAX_P) return 'That is way past the portion already.';
  return null;
}
function startPour(k) {
  if (!playing()) return;
  const why = pourBlock(k);
  if (why) { toast(why); return; }
  G.sh.pouring = k; refreshPrep();
}
function stopPour() { if (G.sh && G.sh.pouring) { G.sh.pouring = null; refreshPrep(); } }
function toOven() {
  if (!playing()) return;
  const sh = G.sh, p = sh.prep;
  if (!p) return;
  if (p.sauce < MIN_P || p.cheese < MIN_P || p.pep < MIN_P) { toast('Not to standard yet. Every ingredient needs a full portion.'); return; }
  const i = freeDeck();
  if (i < 0) { toast('No free deck. Pull a pizza first.', 'bad'); return; }
  sh.oven[i] = p; sh.prep = null; sh.pouring = null;
  sfx('pop'); refreshPrep(); refreshOven();
}
function scrapPrep() {
  if (!playing() || !G.sh.prep) return;
  G.sh.prep.state = 'scrap'; G.sh.scrapN++; G.sh.log.push({ min: nowMin(), why: 'Scrapped at prep' }); G.sh.prep = null; G.sh.pouring = null;
  sfx('bad'); toast('Scrapped. Paid for, never sold.', 'bad'); refreshPrep(); refreshLive();
}
function pull(i) {
  if (!playing()) return;
  const sh = G.sh, p = sh.oven[i];
  if (!p) return;
  if (sh.board) { toast('The cutting board is full. Cut and box that pizza first.', 'bad'); return; }
  sh.oven[i] = null; sh.board = p;
  sfx('pop'); refreshOven(); refreshBoard();
}
function cut() {
  if (!playing()) return;
  const p = G.sh.board;
  if (!p || p.cut) return;
  const g = grade(p.bake);
  if (g === 'under') { toast('Still pale. Put it back in the oven.'); return; }
  if (g === 'burnt') { toast('Nobody pays $12 for that. Scrap it.'); return; }
  p.cut = true; sfx('pop'); refreshBoard();
}
function rework() {
  if (!playing()) return;
  const sh = G.sh, p = sh.board;
  if (!p || grade(p.bake) !== 'under') return;
  const i = freeDeck();
  if (i < 0) { toast('No free deck. Pull something out first.', 'bad'); return; }
  sh.oven[i] = p; sh.board = null; sh.reworkN++;
  sfx('pop'); refreshBoard(); refreshOven();
}
function scrapBoard() {
  if (!playing() || !G.sh.board) return;
  G.sh.log.push({ min: nowMin(), why: grade(G.sh.board.bake) === 'burnt' ? 'Burnt' : 'Underbaked, scrapped' });
  G.sh.board.state = 'scrap'; G.sh.scrapN++; G.sh.board = null;
  sfx('bad'); toast('Scrapped. Paid for, never sold.', 'bad'); refreshBoard(); refreshLive();
}
function box() {
  if (!playing()) return;
  const sh = G.sh, p = sh.board;
  if (!p) return;
  if (!p.cut) { toast('Routing: cut before you box.'); return; }
  p.state = 'boxed'; sh.boxed++; sh.board = null; sh.boxTimes.push(nowMin());
  sfx('box'); refreshBoard(); refreshBoxes();
  if (sh.practice) { practiceDone(); return; }
  refreshLive();
  if (sh.boxed >= ORDER) endShift(false);
}

let liveTick = 0;

/* ---------- loop ---------- */
function update(dt) {
  const sh = G.sh;
  sh.t += dt;
  if (sh.stretch > 0) { sh.stretch -= dt; if (sh.stretch <= 0) { sh.stretch = 0; sh.stretchDone = true; dough(); } }
  const ev = sh.event;
  if (ev && ev.id === 'oven' && !ev.fired && nowMin() >= ev.at) {
    let i = -1; for (let k = sh.oven.length - 1; k >= 0; k--) if (!sh.oven[k]) { i = k; break; }
    if (i >= 0) { ev.fired = true; ev.deck = i; ev.a = nowMin(); sh.down = { i, until: ev.a + ev.down }; ev.b = sh.down.until; stopPour(); G.paused = true; eventScreen(); return; }
  }
  if (sh.pouring) {
    const p = sh.prep, k = sh.pouring;
    if (!p || pourBlock(k)) sh.pouring = null;
    else {
      p[k] = Math.min(MAX_P, p[k] + dt / POUR_SEC);
      if (p[k] >= MAX_P) { sh.pouring = null; toast('Way over the portion. The customer still pays $12.', 'bad'); }
    }
    refreshPrep();
  }
  for (const p of sh.oven) {
    if (!p) continue;
    const before = p.bake;
    p.bake = Math.min(p.bake + dt / BAKE_SEC, 2);
    if (before < GOOD_LO && p.bake >= GOOD_LO) sfx('ready');
    if (before < GOOD_HI && p.bake >= GOOD_HI) { sfx('burn'); toast('A pizza is burning in the oven!', 'bad'); }
  }
  if (!sh.practice) {
    // Who waited on whom: the basis for naming the bottleneck.
    // What each available deck was doing: baking (oven working), holding a finished pizza (waiting to be
    // unloaded), or empty (waiting for prep). The bottleneck is judged from these shares.
    const dm = dt / SEC_PER_MIN, w = sh.wait;
    sh.oven.forEach((q, i) => {
      if (isDown(i)) return;
      w.avail += dm;
      if (!q) w.empty += dm; else if (q.bake < GOOD_LO) w.baking += dm; else w.holding += dm;
    });
  }
  if (!sh.practice && !sh.lateNoted && nowMin() > sh.promiseMin) { sh.lateNoted = true; toast('Past the promise. Overtime now.', 'bad'); }
  refreshOven(); refreshTop();
  if (sh.practice) { coach(); return; }
  liveTick += dt;
  if (liveTick > 0.25) { liveTick = 0; refreshLive(); }
  if (nowMin() >= MAX_MIN) endShift(true);
}
let last = 0;
function frame(t) {
  const dt = last ? Math.min(0.1, (t - last) / 1000) : 0;
  last = t;
  if (playing()) update(dt);
  requestAnimationFrame(frame);
}

/* ---------- charts ---------- */
const CC = { you: '#c94d3a', blue: '#2f6fb5', teal: '#2a9d8f', std: '#9aa0a6', surface: '#fffaf2', ink: '#1f2833' };
const esc = (t) => String(t).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
const tipEl = document.createElement('div'); tipEl.className = 'ctip'; tipEl.hidden = true; document.body.appendChild(tipEl);
function showTip(text, x, y) {
  tipEl.textContent = text; tipEl.hidden = false;
  const r = tipEl.getBoundingClientRect();
  let L = x + 14, T = y - r.height - 12;
  if (L + r.width > innerWidth - 8) L = x - r.width - 14;
  if (T < 8) T = y + 18;
  tipEl.style.left = Math.max(8, L) + 'px'; tipEl.style.top = T + 'px';
}
function hideTip() { tipEl.hidden = true; }
document.addEventListener('pointermove', (e) => {
  const t = e.target.closest && e.target.closest('[data-tip]');
  if (t) showTip(t.dataset.tip, e.clientX, e.clientY);
  else if (!(e.target.closest && e.target.closest('.xchart'))) hideTip();
});
function niceTicks(lo, hi, n = 4) {
  const raw = (hi - lo) / n || 1, mag = 10 ** Math.floor(Math.log10(raw));
  const st = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((x) => x >= raw);
  const a = Math.floor(lo / st) * st, z = Math.ceil(hi / st) * st, out = [];
  for (let v = a; v <= z + st * 1e-6; v += st) out.push(+v.toFixed(6));
  return { ticks: out, lo: a, hi: z };
}
// Nearest-x hover: a guide line, a highlight dot and a tooltip.
function hoverX(el, pts) {
  const svg = el.querySelector('svg'); if (!svg || !pts.length) return;
  const guide = svg.querySelector('.hv-line'), dot = svg.querySelector('.hv-dot');
  el.onpointermove = (e) => {
    const r = svg.getBoundingClientRect(), x = e.clientX - r.left;
    let best = pts[0]; for (const p of pts) if (Math.abs(p.x - x) < Math.abs(best.x - x)) best = p;
    guide.setAttribute('x1', best.x); guide.setAttribute('x2', best.x); guide.style.visibility = 'visible';
    if (best.y != null) { dot.setAttribute('cx', best.x); dot.setAttribute('cy', best.y); dot.style.visibility = 'visible'; } else dot.style.visibility = 'hidden';
    showTip(best.tip, e.clientX, e.clientY);
  };
  el.onpointerleave = () => { guide.style.visibility = 'hidden'; dot.style.visibility = 'hidden'; hideTip(); };
}
const hoverMarks = (t, b, col = CC.ink) => `<line class="hv-line" y1="${t}" y2="${b}" stroke="${CC.ink}" stroke-opacity=".25" stroke-width="1" style="visibility:hidden"/>
  <circle class="hv-dot" r="5" fill="${col}" stroke="${CC.surface}" stroke-width="2" style="visibility:hidden"/>`;
const shortClock = (m) => clock(m).replace(/ (AM|PM)$/, '');

// 1. Pizzas boxed against the clock, with the standard pace and the promise.
function prodChart(el, o) {
  o = { ...o, times: [...o.times].sort((a, b) => a - b) };
  const w = Math.max(260, el.clientWidth || 600), h = o.h || 170, l = 30, r = 18, t = 18, b = 24;
  const stdEnd = (ORDER / STD_RATE) * 60, last = o.times.length ? o.times[o.times.length - 1] : 0;
  let xmax = Math.max(o.promise, o.now, stdEnd, last) * 1.06;
  const st = xmax > 150 ? 30 : xmax > 75 ? 15 : 10; xmax = Math.ceil(xmax / st) * st;
  const xs = (m) => l + (m / xmax) * (w - l - r), ys = (n) => t + (1 - n / ORDER) * (h - t - b);
  let g = '';
  for (const n of [0, ORDER / 2, ORDER]) g += `<line class="gl" x1="${l}" x2="${w - r}" y1="${ys(n)}" y2="${ys(n)}"/><text x="${l - 6}" y="${ys(n) + 4}" text-anchor="end">${n}</text>`;
  for (let m = 0; m <= xmax + 1e-6; m += st) g += `<text x="${xs(m)}" y="${h - 6}" text-anchor="middle">${shortClock(m)}</text>`;
  if (o.gap && o.gap.len >= 3) {
    g += `<rect x="${xs(o.gap.a)}" y="${t}" width="${Math.max(2, xs(o.gap.b) - xs(o.gap.a))}" height="${h - t - b}" fill="${CC.you}" opacity=".09"/>
      <text class="ink" x="${(xs(o.gap.a) + xs(o.gap.b)) / 2}" y="${t - 5}" text-anchor="middle">${dur(o.gap.len)} gap</text>`;
  }
  if (o.event && o.event.b > o.event.a) {
    g += `<rect x="${xs(o.event.a)}" y="${t}" width="${Math.max(2, xs(o.event.b) - xs(o.event.a))}" height="${h - t - b}" fill="${CC.ink}" opacity=".07"/>
      <text class="ink" x="${xs(o.event.a) + 4}" y="${t + 12}">${o.event.label}</text>`;
  } else if (o.event) g += `<text class="ink" x="${l + 6}" y="${t + 12}">${o.event.label}</text>`;
  g += `<line x1="${xs(0)}" y1="${ys(0)}" x2="${xs(stdEnd)}" y2="${ys(ORDER)}" stroke="${CC.std}" stroke-width="2" stroke-linecap="round"/>`;
  const px = xs(o.promise), right = px > w - 70;
  g += `<line x1="${px}" x2="${px}" y1="${t}" y2="${h - b}" stroke="${CC.blue}" stroke-width="2"/>
    <text x="${px + (right ? -5 : 5)}" y="${h - b - 6}" text-anchor="${right ? 'end' : 'start'}">Promise ${shortClock(o.promise)}</text>`;
  let d = `M${xs(0)},${ys(0)}`;
  o.times.forEach((tm, i) => { d += ` H${xs(tm)} V${ys(i + 1)}`; });
  const endX = Math.max(last, o.now);
  if (endX > last) d += ` H${xs(endX)}`;
  g += `<path d="${d} V${ys(0)} H${xs(0)} Z" fill="${CC.you}" opacity=".1"/>`;
  g += `<path d="${d}" fill="none" stroke="${CC.you}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  g += `<circle cx="${xs(endX)}" cy="${ys(o.times.length)}" r="4" fill="${CC.you}" stroke="${CC.surface}" stroke-width="2"/>`;
  g += hoverMarks(t, h - b, CC.you);
  el.innerHTML = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Pizzas boxed over time: ${o.times.length} of ${ORDER}, against the standard of 20 an hour">${g}</svg>`;
  hoverX(el, o.times.map((tm, i) => ({ x: xs(tm), y: ys(i + 1), tip: `${clock(tm)}\nPizza ${i + 1} boxed\nStandard by then: ${Math.min(ORDER, Math.floor(tm / 3))}` })));
}

// 2. Cost per pizza across run rates, under the current levers.
function costChart(el, d, lv) {
  const w = Math.max(260, el.clientWidth || 400), h = 190, l = 42, r = 16, t = 14, b = 26;

  const yt = niceTicks(Math.min(STD_COST, ...curve.map((p) => p[1])) - 0.5, Math.max(base, ...curve.map((p) => p[1])) + 0.3, 4);
  const xs = (x) => l + ((x - rlo) / (rhi - rlo)) * (w - l - r), ys = (y) => t + (1 - (y - yt.lo) / (yt.hi - yt.lo)) * (h - t - b);

  for (let x = Math.ceil(rlo / 4) * 4; x <= rhi; x += 4) g += `<text x="${xs(x)}" y="${h - 6}" text-anchor="middle">${x}/hr</text>`;
  g += `<path d="${curve.map((p, i) => `${i ? 'L' : 'M'}${xs(p[0])},${ys(p[1])}`).join(' ')}" fill="none" stroke="${CC.blue}" stroke-width="2" stroke-linejoin="round"/>`;
  g += `<circle cx="${xs(20)}" cy="${ys(STD_COST)}" r="5" fill="${CC.std}" stroke="${CC.surface}" stroke-width="2"/><text x="${xs(20)}" y="${ys(STD_COST) + 18}" text-anchor="middle">Standard $7.00</text>`;
  const moved = Math.abs(now - base) > 0.005 || Math.abs(lv.rate - d.dem) > 0.05;
  g += `<circle cx="${xs(d.dem)}" cy="${ys(base)}" r="5" fill="${moved ? CC.surface : CC.you}" stroke="${CC.you}" stroke-width="2"/>
    <text class="ink" x="${xs(d.dem)}" y="${ys(base) - 10}" text-anchor="middle">You ${money(base)}</text>`;
  if (moved) g += `<circle cx="${xs(lv.rate)}" cy="${ys(now)}" r="6" fill="${CC.you}" stroke="${CC.surface}" stroke-width="2"/>
    <text class="ink" x="${xs(lv.rate) + 9}" y="${ys(now) + 4}">${money(now)}</text>`;
  g += hoverMarks(t, h - b, CC.blue);
  el.innerHTML = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Cost per pizza falls as the run rate rises">${g}</svg>`;
  hoverX(el, curve.filter((p) => Math.abs(p[0] * 2 - Math.round(p[0] * 2)) < 1e-6).map((p) => ({ x: xs(p[0]), y: ys(p[1]), tip: `At ${p[0]} an hour\n${money(p[1])} a pizza` })));
}

// 3. Profit bridge: standard profit, each leak, your profit.
function bridgeHTML(d) {
  const c = d.c, raw = leakList(d), steps = [];
  const rr = roundRows(raw.map((x) => [x.label, x.v]), c.std.op - c.op);
  const L = raw.map((x, i) => ({ ...x, v: rr[i][1] }));
  let run = c.std.op;
  steps.push({ label: 'Standard profit', a: 0, b: run, kind: 'total', val: money(run), tip: `Joe's standard for ${c.good} pizzas` });
  for (const x of L) {
    const nb = run - x.v;
    steps.push({ label: x.label, clue: x.clue, a: Math.min(run, nb), b: Math.max(run, nb), kind: x.v > 0 ? 'loss' : 'gain', val: `${x.v > 0 ? '-' : '+'}${money(Math.abs(x.v))}`, tip: `${x.label}: ${x.clue}` });
    run = nb;
  }
  const opR = Math.round((c.std.op - L.reduce((a, x) => a + x.v, 0)) * 100) / 100;
  steps.push({ label: 'Your profit', a: Math.min(0, opR), b: Math.max(0, opR), kind: 'total', val: money(opR), tip: `What this Friday kept` });
  const lo = Math.min(0, ...steps.map((x) => x.a)), hi = Math.max(...steps.map((x) => x.b));
  const span = (hi - lo) * 1.3 || 1, pos = (v) => ((v - lo) / span) * 100, z = pos(0);
  return `<div class="wf">${steps.map((x) => `<div class="wf-row"><span class="wf-label">${x.label}${x.clue ? `<small>${x.clue}</small>` : ''}</span>
    <div class="wf-track"><span class="zero" style="left:${z}%"></span>
      <i class="wf-${x.kind}" style="left:${pos(x.a)}%;width:${Math.max(0.6, pos(x.b) - pos(x.a))}%" data-tip="${esc(x.tip)}"></i>
      <b style="left:calc(${pos(x.b)}% + 6px)">${x.val}</b></div></div>`).join('')}</div>`;
}

// 4. Small multiples across the three Fridays.
function lineChart(el, cats, series, opts = {}) {

  const yt = opts.zero && lo >= 0 ? niceTicks(0, hi * 1.08 || 1, 3) : niceTicks(lo - (hi - lo) * 0.08, hi + (hi - lo) * 0.08 || hi + 1, 3);
  const xs = (i) => (cats.length === 1 ? (l + w - r) / 2 : l + (i * (w - l - r)) / (cats.length - 1)), ys = (v) => t + (1 - (v - yt.lo) / (yt.hi - yt.lo)) * (h - t - b);

    tip: [cname, ...series.filter((x) => x.vals[i] != null).map((x) => `${x.name}: ${opts.fmt(x.vals[i])}`), opts.ref ? `${opts.ref.label}` : ''].filter(Boolean).join('\n') })));

/* ---------- debrief ---------- */
const ING_LABEL = { sauce: 'sauce', cheese: 'cheese', pep: 'pepperoni' };
const mmss = (min) => { const s = Math.round(min * 60); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
function debData(c, sh) {
  const good = c.good, P = c.parts;
  const heavyBy = { sauce: 0, cheese: 0, pep: 0 }; let heavyPies = 0;
  sh.pies.filter((p) => p.state === 'boxed').forEach((p) => {
    let h = false;
    for (const k of ['sauce', 'cheese', 'pep']) { if (p[k] > 1) heavyBy[k] += COST[k] * (p[k] - 1); if (p[k] > 1.05) h = true; }
    if (h) heavyPies++;
  });
  const worst = Object.entries(heavyBy).sort((a, b) => b[1] - a[1])[0];
  // Gaps between boxed pizzas only: the first bake at the start isn't a gap.
  let gap = { len: 0, a: 0, b: 0 };
  sh.boxTimes.forEach((t, i) => { if (i && t - sh.boxTimes[i - 1] > gap.len) gap = { len: t - sh.boxTimes[i - 1], a: sh.boxTimes[i - 1], b: t }; });
  return { c, sh, good, dem: c.rate, overPer: P.over / good, scrapPer: P.scrap / good, schedHrs: sh.promiseMin / 60, evPer: P.event / good,
    per: { mat: c.mat / good, lab: c.labor / good, oh: c.oh / good, cost: c.cogs / good },
    heavyPies, worst, gap, leftovers: sh.pies.filter((p) => p.leftover).length, bn: bottleneck(sh, c) };
}
const BN_NAME = { prep: 'Prep (you)', oven: 'The oven', cut: 'Pull, cut + box' };
function bottleneck(sh, c) {
  const w = sh.wait, A = w.avail || 1;
  const baking = w.baking / A, holding = w.holding / A, empty = w.empty / A;
  // The oven only sets the pace when it is baking almost nonstop.
  // Otherwise the oven was waiting on someone: on unloading if finished pizzas sat longer than decks sat empty, else on prep.
  const id = baking >= 0.8 ? 'oven' : holding > empty ? 'cut' : 'prep';
  return { id, baking, holding, empty, perPizza: c.min / Math.max(1, c.good) };
}
function bottleneckHTML(d) {
  const bn = d.bn, pct = (x) => Math.round(x * 100);
  const node = (id, step, name, stat) => `<div class="node ${bn.id === id ? 'bn' : ''}">${bn.id === id ? '<span class="bn-tag">Bottleneck</span>' : ''}<small>${step}</small><b>${name}</b><span>${stat}</span></div>`;
  const why = bn.id === 'oven' ? `The oven was baking <b>${pct(bn.baking)}%</b> of the time. It set the pace: faster prep wouldn't have helped. More oven would.`
    : bn.id === 'cut' ? `Finished pizzas sat in the decks <b>${pct(bn.holding)}%</b> of the time before being pulled. The oven had room. Pull, cut and box sooner to keep it turning.`
    : `The oven was baking only <b>${pct(bn.baking)}%</b> of the time and sat empty <b>${pct(bn.empty)}%</b>, waiting for your next pizza. A bigger oven wouldn't have helped. Faster prep would.`;
  return `<div class="chart-card"><h3>This Friday's bottleneck: ${BN_NAME[bn.id]}</h3>
    <div class="flow">
      ${node('prep', 'Steps 1–2', 'Prep (you)', `a pizza every ${mmss(bn.perPizza)}`)}<span class="arr" aria-hidden="true">→</span>
      ${node('oven', 'Step 3', 'Oven', `baking ${pct(bn.baking)}% · empty ${pct(bn.empty)}%`)}<span class="arr" aria-hidden="true">→</span>
      ${node('cut', 'Steps 4–5', 'Pull, cut + box', bn.holding >= 0.05 ? `done pizzas waited ${pct(bn.holding)}%` : 'kept up')}

function project(d, L) {
  const hrs = ORDER / L.rate, sched = L.honest ? hrs : d.schedHrs;
  const mat = STD_MAT * ORDER + (L.exact ? 0 : d.overPer * ORDER) + (L.noScrap ? 0 : d.scrapPer * ORDER);
  const ot = Math.max(0, hrs - sched), idle = Math.max(0, sched - hrs);
  const labor = WAGE * Math.min(hrs, sched) + OT_WAGE * ot + WAGE * idle, oh = OH_PER_HR * hrs;
  const lateMin = ot * 60, pct = lateMin > 0.5 ? Math.min(0.25, 0.05 * Math.ceil(lateMin / 15)) : 0;
  const ev = (d.evPer || 0) * ORDER;
  const cogs = mat + labor + oh + ev, rev = PRICE * ORDER * (1 - pct);
  return { cost: cogs / ORDER, op: rev - cogs - OTHER * ORDER, pct };
}
function goalResult(goal, d) {
  const c = d.c;
  if (goal.id === 'rate') return { hit: d.dem >= goal.target - 0.2, txt: `You ran ${r1(d.dem)}.` };
  if (goal.id === 'scrap') return { hit: d.sh.scrapN === 0, txt: d.sh.scrapN ? `${d.sh.scrapN} scrapped.` : 'Nothing scrapped.' };
  if (goal.id === 'exact') return { hit: d.overPer <= 0.05, txt: `${money(Math.max(0, d.overPer))} a pizza over.` };
  const early = d.sh.promiseMin - c.min;
  return { hit: c.late <= 0.5 && early < 5, txt: c.late > 0.5 ? `${dur(c.late)} late.` : early >= 5 ? `${dur(early)} early.` : 'Right on time.' };
}

function leakList(d) {
  const c = d.c, P = c.parts, sh = d.sh, L = [];
  const pace = P.slow + P.oh;
  L.push({ tag: 'Time', label: pace >= 0 ? 'Slower than 20 an hour' : 'Faster than 20 an hour', v: pace,
    clue: `${mmss(c.min / d.good)} a pizza vs. 3:00${d.gap.len >= 4 ? ` · longest gap ${dur(d.gap.len)}` : ''}` });
  if (P.ot + P.disc > 0.004) L.push({ tag: 'Promise', label: 'Missed the promise', v: P.ot + P.disc, clue: `${dur(c.late)} late: overtime${c.discPct ? ` + ${Math.round(c.discPct * 100)}% off` : ''}` });
  if (P.idle > 0.004) L.push({ tag: 'Promise', label: 'Promised too slow', v: P.idle, clue: `Done ${dur(sh.promiseMin - c.min)} early, hours already paid` });
  if (P.scrap > 0.004) {
    const leftMat = sh.pies.filter((p) => p.leftover).reduce((a, p) => a + pieMat(p), 0);
    const scrapMat = P.scrap - leftMat;
    if (scrapMat > 0.004) L.push({ tag: 'Material', label: 'Scrapped pizzas', v: scrapMat, clue: sh.log.map((e) => `${e.why.toLowerCase()} ${clock(e.min)}`).join(' · ') || 'scrapped' });
    if (leftMat > 0.004) L.push({ tag: 'Material', label: 'Made but not needed', v: leftMat, clue: `${d.leftovers} started past the order: overproduction` });
  }
  const ev = sh.event;
  if (ev && ev.choice && P.event > 0.004) {
    const what = ev.id === 'oven' ? 'Oven down' : 'Callout';
    const clue = ev.choice === 'call' ? `called the customer: ${Math.round(REPROMISE_OFF * 100)}% off` : ev.choice === 'expedite' ? `emergency repair $${EXPEDITE_COST}` : `replacement on overtime`;
    L.push({ tag: 'Event', label: what, v: P.event, clue });
  }
  if (Math.abs(P.over) > 0.004) L.push({ tag: 'Material', label: P.over > 0 ? 'Heavy portions' : 'Light portions', v: P.over, clue: P.over > 0 ? `mostly ${ING_LABEL[d.worst[0]]}` : 'slightly under' });
  return L.sort((a, b) => b.v - a.v);
}

function fixList(d) {
  const base = { rate: d.dem, exact: false, noScrap: false, honest: false }, b = project(d, base);
  const tgt = d.dem >= STD_RATE - 0.05 ? null : Math.min(STD_RATE, Math.round(d.dem) + 4);
  const list = [
    { id: 'rate', label: tgt ? `Run ${tgt} an hour` : 'Run faster', short: tgt ? `${tgt}/hr` : 'Rate', target: tgt,
      how: 'Keep a dough ready and the oven loaded so the line never waits.', L: { ...base, rate: tgt || d.dem } },
    { id: 'honest', label: 'Honest promise', short: 'Honest promise',
      how: 'Plan with demonstrated capability instead of the standard.', L: { ...base, honest: true } },
    { id: 'scrap', label: 'Zero scrap', short: 'Zero scrap', how: 'Pull every pizza in the green. Never let a deck burn.', L: { ...base, noScrap: true } },
    { id: 'exact', label: 'Exact portions', short: 'Exact portions', how: 'Let go in the green on every pour.', L: { ...base, exact: true } },

function coach() {
  const sh = G.sh, b = sh.board, ov = sh.oven.findIndex((x) => x);
  let key, txt, sel;
  if (b) {
    const g = grade(b.bake);
    if (g === 'burnt') { key = 'scrap'; txt = 'Burnt. Press Scrap.'; sel = '#btnScrapBoard'; }

    else { key = 'box'; txt = 'Press B to box.'; sel = '#btnBox'; }

    if (g === 'good') { key = 'pull'; txt = `Green! Press ${ov + 1} to pull it.`; sel = '#decks'; }
    else if (g === 'burnt') { key = 'burn'; txt = `Burning! Press ${ov + 1}.`; sel = '#decks'; }
    else { key = 'wait'; txt = 'Baking. Pull it when the needle hits green.'; sel = '#decks'; }
  } else if (sh.prep) {

    if (p.sauce < MIN_P) { key = 'sauce'; txt = 'Hold S. Let go in the green.'; sel = '#pour-sauce'; }
    else if (p.cheese < MIN_P) { key = 'cheese'; txt = 'Hold C. Let go in the green.'; sel = '#pour-cheese'; }
    else if (p.pep < MIN_P) { key = 'pep'; txt = 'Hold P. Let go in the green.'; sel = '#pour-pep'; }

function refreshBooks() {

}

function buyOvenIfReady(pay) {
  const B = G.books;
  if (!B.ovenBought && B.ovenFund >= OVEN_COST - 0.005) { B.ovenFund -= OVEN_COST; B.ovenBought = true; B.decks = 3; pay.bought = true; }
}
function settle(c) {
  // Joe's plan: every Friday's standard profit (10 pizzas x $2) goes into the new-oven fund.
  // If the Friday delivers less, the whole gap (plan - net) is one decision: savings, the bank,
  // or the oven (the fund ends lower than planned). The planned deposit is credited up front,
  // so taking from the oven can never spend more than the fund plus the deposit Joe skips.
  const B = G.books, plan = 2 * ORDER;
  const interest = Math.round(B.loan * INTEREST * 100) / 100, net = c.op - interest;
  const pay = { interest, net, plan, gap: Math.max(0, plan - net), covered: 0, from: { savings: 0, loan: 0, oven: 0 },
    fundStart: B.ovenFund, repaid: 0, extra: 0, bought: false };
  if (net >= plan) {
    B.ovenFund += plan;
    const surplus = net - plan;
    pay.repaid = Math.min(B.loan, surplus); B.loan -= pay.repaid;
    pay.extra = surplus - pay.repaid; B.ovenFund += pay.extra;
    buyOvenIfReady(pay);
  } else {
    B.ovenFund += plan;
  }
  saveBooks(); refreshBooks();
  return pay;
}
function available(src) {
  const B = G.books;
  return src === 'savings' ? B.savings : src === 'oven' ? B.ovenFund : Math.max(0, BANK_LIMIT - B.loan);
}
function fundFrom(src) {
  const pay = G.deb.pay, B = G.books, amt = Math.min(pay.gap - pay.covered, available(src));
  if (amt < 0.005) return;
  if (src === 'savings') B.savings -= amt; else if (src === 'oven') B.ovenFund -= amt; else B.loan += amt;
  pay.from[src] += amt; pay.covered += amt;
  if (pay.gap - pay.covered < 0.005) buyOvenIfReady(pay);
  sfx('pop'); saveBooks(); refreshBooks();
}
function autoFund(pay) {
  const parts = [];
  for (const src of ['oven', 'savings', 'loan']) {
    const amt = Math.min(pay.gap - pay.covered, available(src));
    if (amt < 0.005) continue;
    if (src === 'savings') G.books.savings -= amt; else if (src === 'oven') G.books.ovenFund -= amt; else G.books.loan += amt;
    pay.covered += amt; pay.from[src] += amt;
    parts.push(`${money(amt)} from ${src === 'savings' ? 'savings' : src === 'oven' ? 'the oven plan' : 'the bank'}`);
  }
  saveBooks(); refreshBooks();
  return parts.length ? `That and the missed $${2 * ORDER} oven deposit came out of ${parts.join(' and ')}.` : '';
}
// Round each row to cents, then nudge the largest so the rows add up exactly to the rounded total.
function roundRows(rows, total) {
  const r = rows.map(([l, v]) => [l, Math.round(v * 100) / 100]);
  const diff = Math.round((Math.round(total * 100) / 100 - r.reduce((a, [, v]) => a + v, 0)) * 100) / 100;
  if (r.length && Math.abs(diff) >= 0.005) {
    let k = 0; r.forEach(([, v], i) => { if (Math.abs(v) > Math.abs(r[k][1])) k = i; });
    r[k][1] = Math.round((r[k][1] + diff) * 100) / 100;
  }
  return r;
}
function resetAll() {
  G.hist = []; G.shiftNo = 0; G.goal = null; G.books = freshBooks();

const SRC_NAME = { savings: 'savings', loan: 'the bank', oven: 'the oven' };

      ${books}${nav}`;
  }

  const loss = pay.net < 0;

      <tr><td>This Friday delivered</td><td class="${loss ? 'over' : ''}">${money(pay.net)}</td></tr>

      <tr class="total"><td>Total</td><td>${money(pay.gap)}</td></tr></tbody></table></details>`;

  const take = (x) => Math.min(left, available(x));
  const planned = pay.fundStart + plan, fundAfter = B.ovenFund - take('oven');

  const card = (src, title, line, cons, none) => `<div class="fund"><b>${title}</b><p class="fline">${line}</p><p class="cons">${cons}</p>
    <button class="btn" type="button" data-act="fund" data-src="${src}" ${open && take(src) > 0.005 ? '' : 'disabled'}>${take(src) > 0.005 ? `Take ${money(take(src))}` : none}</button></div>`;
  const used = Object.entries(pay.from).filter(([, v]) => v > 0.005).map(([k, v]) => `${money(v)} from ${SRC_NAME[k]}`);

  return `<h2>${open ? `Joe is ${money(pay.gap)} short. Where does it come from?` : 'Every dollar came from somewhere.'}</h2>
    <p class="sub">${loss ? `The night lost <b>${money(-pay.net)}</b>, and the plan needed <b>${money(plan)}</b> for the oven.` : `The plan needed <b>${money(plan)}</b> for the oven. This Friday made <b>${money(pay.net)}</b>.`}</p>
    ${open ? `<div class="funds">
      ${card('savings', 'Savings', `${money(B.savings)} → ${money(B.savings - take('savings'))}`, 'Less cash for the next bad night', 'Empty')}
      ${card('loan', 'Borrow', `Owe ${money(B.loan + take('loan'))}`, `Debt + ${Math.round(INTEREST * 100)}% a Friday`, 'Bank says no')}

    ${used.length ? `<p class="paid">Covered: ${used.join(' + ')}.</p>` : ''}

      <div class="cta-row"><button class="btn red" type="button" data-act="closeout" data-broke="1">Close out the run</button></div>` : ''}

        <label for="cAct">Actual rate / hr<input id="cAct" type="number" min="0" step="any" value="80" inputmode="decimal"></label>
        <label for="cHrs">Shift hours<input id="cHrs" type="number" min="0" step="any" value="8" inputmode="decimal"></label>
        <label for="cCrew">Crew<input id="cCrew" type="number" min="0" step="any" value="4" inputmode="decimal"></label>
        <label for="cWage">Labor $ / hr<input id="cWage" type="number" min="0" step="any" value="22" inputmode="decimal"></label>
        <label for="cOh">Overhead $ / hr<input id="cOh" type="number" min="0" step="any" value="60" inputmode="decimal"></label>
      </div>
      <div class="calc-out" id="calcOut" aria-live="polite"></div>
      <p class="note" id="calcNote" style="margin-top:10px"></p>
    </div>
    ${last ? `<details class="math"><summary>Joe's Pizza in factory terms</summary><div class="scroll-x">
      <table class="hist xlate"><thead><tr><th>Joe's Pizza</th><th>Factory</th><th>Your run</th></tr></thead><tbody>${xl}</tbody></table></div></details>` : ''}
    <div class="closing"><p>Revenue is earned by the customer. <span>Profit is protected by execution.</span></p></div>
    <div class="cta-row"><button class="btn red" type="button" data-act="newrun">Start a new run</button>
      ${G.deb ? '<button class="btn link" type="button" data-act="full">Full numbers</button>' : ''}</div>`, true);
  updateCalc();
}
function updateCalc() {
  const v = (id) => Math.max(0, parseFloat($('#' + id).value) || 0);
  const std = v('cStd'), act = v('cAct'), hrs = v('cHrs'), conv = v('cCrew') * v('cWage') + v('cOh');
  if (!std || !act || !conv) { $('#calcOut').innerHTML = ''; $('#calcNote').textContent = 'Enter a standard rate, a demonstrated rate and at least one cost per hour.'; return; }
  const su = conv / std, au = conv / act, lost = (std - act) * hrs, gap = conv * hrs * (1 - act / std);
  $('#calcOut').innerHTML = `
    <div><small>Labor + overhead per unit</small><b>${money(au)}</b><span>vs. ${money(su)} at standard</span></div>
    <div><small>Capacity ${lost >= 0 ? 'given up' : 'gained'} per shift</small><b>${Math.round(Math.abs(lost)).toLocaleString()} units</b><span>${Math.round(std * hrs).toLocaleString()} planned, ${Math.round(act * hrs).toLocaleString()} demonstrated</span></div>
    <div><small>Cost of the gap</small><b>${money(Math.abs(gap))}</b><span>a shift. ${money(Math.abs(gap) * 5)} a week, ${money(Math.abs(gap) * 250)} a year</span></div>`;
  $('#calcNote').textContent = act < std ? "The product didn't change. The process did." : 'At standard. Can the line repeat it every shift?';
}

/* ---------- floor events ---------- */
function eventScreen() {
  const sh = G.sh, ev = sh.event, fri = G.shiftNo + 1;
  const card = (choice, title, line, cons) => `<div class="fund"><b>${title}</b><p class="fline">${line}</p><p class="cons">${cons}</p>
    <button class="btn" type="button" data-act="event" data-choice="${choice}" aria-label="${title}">Choose</button></div>`;
  if (ev.id === 'oven') {
    show(`<p class="eyebrow">Friday ${fri} · ${clock(ev.a)}</p>
      <h2>Oven deck ${ev.deck + 1} just went down.</h2>
      <p class="sub">Maintenance says ${ev.down} minutes. You promised <b>${clock(sh.promiseMin)}</b>.</p>
      <div class="funds">
        ${card('call', 'Call the customer now', `New time: ${clock(sh.promiseMin + ev.down)}`, `${Math.round(REPROMISE_OFF * 100)}% off for the change`)}
        ${card('push', 'Push on', `Keep ${clock(sh.promiseMin)} on ${sh.oven.length - 1} deck${sh.oven.length - 1 === 1 ? '' : 's'}`, 'If late: overtime + a bigger discount')}
        ${card('expedite', 'Expedite the repair', `Back in ${ev.fast} minutes`, `$${EXPEDITE_COST} emergency call-out`)}
      </div>`);
  } else {
    const add = ORDER * (HAND_STRETCH_SEC / SEC_PER_MIN);
    ev.add = add;
    show(`<p class="eyebrow">Friday ${fri} · before the shift</p>
      <h2>Your prep cook called out.</h2>
      <p class="sub">They pre-stretch the dough. Without them, every dough takes you about ${HAND_STRETCH_SEC / SEC_PER_MIN} more minute. You promised <b>${clock(sh.promiseMin)}</b>.</p>
      <div class="funds">
        ${card('call', 'Call the customer now', `New time: ${clock(sh.promiseMin + add)}`, `${Math.round(REPROMISE_OFF * 100)}% off for the change`)}
        ${card('push', 'Push on', `Keep ${clock(sh.promiseMin)}, stretch by hand`, 'If late: overtime + a bigger discount')}
        ${card('cover', 'Call someone in', 'Dough stays fast', `$${COVER_WAGE} an hour, overtime`)}
      </div>`);
  }
}
function chooseEvent(choice) {
  const sh = G.sh, ev = sh.event;
  if (!ev || ev.choice) return;
  ev.choice = choice;
  if (choice === 'call') { sh.repromise = true; sh.promiseMin += ev.id === 'oven' ? ev.down : ev.add; }
  if (ev.id === 'oven' && choice === 'expedite') { sh.expedite = true; sh.down.until = ev.a + ev.fast; ev.b = sh.down.until; }
  if (ev.id === 'callout') { if (choice === 'cover') sh.cover = true; else sh.handDough = true; }
  G.paused = false; hide();
  refreshPrep(); refreshOven(); refreshBoard(); refreshTop();
  toast(choice === 'call' ? `New promise: ${clock(sh.promiseMin)}.` : choice === 'push' ? `Holding ${clock(sh.promiseMin)}.` : choice === 'expedite' ? 'Repair crew on the way.' : 'Replacement on the way.');
}
function eventLesson(d) {
  const ev = d.sh.event, c = d.c;
  if (!ev || !ev.choice) return '';
  const what = ev.id === 'oven' ? 'The oven went down' : 'A cook called out';
  const txt = ev.choice === 'call' ? `${what}. You told the customer early and paid ${money(c.repDisc)}.`
    : ev.choice === 'push' ? (c.late > 0.5 ? `${what}. You pushed on and missed by ${dur(c.late)}: ${money(c.parts.ot + c.parts.disc)} in overtime and discount.` : `${what}. You pushed on and made it. This time.`)
    : `${what}. You paid ${money(c.evCost)} to protect the promise.`;
  const bnNote = ev.id === 'oven' ? (d.bn.id === 'oven' ? ' The oven was your bottleneck, so every minute of that deck was lost output.' : " The oven wasn't your bottleneck this Friday, so the lost deck cost less than it looked.") : '';
  return `<p class="insight">${txt}${bnNote} <b>${QUOTE}</b></p>`;
}

function pauseScreen() {
  show(`<p class="eyebrow">Paused · ${clock(nowMin())}</p><h2>Break room</h2><p>The oven and the clock are stopped.</p>
    <div class="cta-row"><button class="btn red" type="button" data-act="resume">Back on the line</button>
    <button class="btn light" type="button" data-act="quit">End this shift now</button></div>`);
}
function togglePause() {
  if (G.phase !== 'play') return;
  const ev = G.sh && G.sh.event;
  if (ev && ev.fired && !ev.choice) return;
  G.paused = !G.paused;
  if (G.paused) { stopPour(); pauseScreen(); } else hide();
  refreshPrep(); refreshBoard(); refreshOven();
}

$('#sheet').addEventListener('click', (e) => {
  const opt = e.target.closest('[data-rate]');
  if (opt) {
    G.pickRate = parseFloat(opt.dataset.rate);
    document.querySelectorAll('.opt').forEach((o) => o.setAttribute('aria-checked', o === opt ? 'true' : 'false'));
    return;
  }
  const a = e.target.closest('[data-act]');
  if (!a) return;
  const act = a.dataset.act;
  if (act === 'promise') promiseScreen();
  else if (act === 'title') titleScreen();
  else if (act === 'start') startShift();
  else if (act === 'resume') togglePause();
  else if (act === 'quit') { G.paused = false; endShift(true); }
  else if (act === 'clear' || act === 'reset-books') { resetAll(); if (act === 'clear') promiseScreen(); else titleScreen(); }
  else if (act === 'practice') startPractice();
  else if (act === 'event') chooseEvent(a.dataset.choice);
  else if (act === 'fund') { fundFrom(a.dataset.src); debriefScreen(true); }
  else if (act === 'reveal') { G.deb.guess = parseFloat($('#guessIn').value); G.deb.guessed = true; debriefScreen(); }
  else if (act === 'step') { G.deb.step = +a.dataset.step; debriefScreen(); }
  else if (act === 'deb') debriefScreen();
  else if (act === 'full') reportScreen(G.deb.c, G.deb.sh, G.deb.early);
  else if (act === 'pick') { G.deb.pick = a.dataset.id; debriefScreen(true); }
  else if (act === 'lock') { G.deb.locked = true; debriefScreen(true); }
  else if (act === 'newrun') { resetAll(); G.endReason = null; promiseScreen(); }
  else if (act === 'closeout') { snapBooks(); if (a.dataset.broke) { G.endReason = 'broke'; G.books.closed = true; saveBooks(); } closeoutScreen(); }
  else if (act === 'commit') {
    snapBooks();
    const f = fixList(G.deb).list.find((x) => x.id === G.deb.pick);
    G.goal = { id: f.id, label: f.label, short: f.short, target: f.target };
    promiseScreen();
  }
});
$('#sheet').addEventListener('input', (e) => {
  if (e.target.id === 'guessIn') $('#guessOut').textContent = money(parseFloat(e.target.value));
  else if (e.target.closest('.levers')) readLevers();
  else if (e.target.closest('.calc')) updateCalc();
});

/* ---------- controls ---------- */
$('#btnDough').addEventListener('click', dough);
$('#btnOven').addEventListener('click', toOven);
$('#btnBinPrep').addEventListener('click', scrapPrep);
$('#btnCut').addEventListener('click', cut);
$('#btnRework').addEventListener('click', rework);
$('#btnScrapBoard').addEventListener('click', scrapBoard);
$('#btnBox').addEventListener('click', box);
$('#btnPause').addEventListener('click', togglePause);
$('#btnSkipPractice').addEventListener('click', () => { endPractice(); G.practiced = true; promiseScreen(); });
$('#btnMute').addEventListener('click', (e) => {
  muted = !muted; e.currentTarget.textContent = muted ? 'Sound off' : 'Sound on'; e.currentTarget.setAttribute('aria-pressed', String(muted));
});
document.querySelectorAll('.pour').forEach((b) => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', (e) => { e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ } startPour(k); });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach((ev) => b.addEventListener(ev, stopPour));
  b.addEventListener('contextmenu', (e) => e.preventDefault());
  b.addEventListener('keydown', (e) => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); startPour(k); } });
  b.addEventListener('keyup', (e) => { if (e.key === ' ' || e.key === 'Enter') stopPour(); });
});
const HOLD = { s: 'sauce', c: 'cheese', p: 'pep' };
document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || !(G.phase === 'play' || G.phase === 'practice')) return;
  const k = e.key.toLowerCase();
  if (k === 'escape') { togglePause(); e.preventDefault(); return; }
  if (G.paused || e.repeat) return;
  if (e.target.closest && e.target.closest('.pour')) return;
  if (HOLD[k]) { startPour(HOLD[k]); e.preventDefault(); }
  else if (k === 'd') dough();
  else if (k === 'o') toOven();
  else if (/^[1-4]$/.test(k)) pull(+k - 1);
  else if (k === 'k') cut();
  else if (k === 'b') box();
});
document.addEventListener('keyup', (e) => { const k = e.key.toLowerCase(); if (HOLD[k] && G.sh && G.sh.pouring === HOLD[k]) stopPour(); });
window.addEventListener('blur', stopPour);
document.addEventListener('visibilitychange', () => { if (document.hidden && G.phase === 'play' && !G.paused) togglePause(); });

/* ---------- boot ---------- */
buildDecks(); buildBoxes(); refreshBooks();
refreshPrep(); refreshOven(); refreshBoard(); refreshBoxes(); refreshLive();
if (G.hist.some((h) => h.cost === undefined)) { G.hist = []; G.books = freshBooks(); saveHist(G.hist); saveBooks(); buildDecks(); refreshBooks(); }
G.shiftNo = G.hist.length;
titleScreen();
requestAnimationFrame(frame);
window.JoesPizza = { get state() { return G; }, calc };
})();
</script>
</body>
</html>
